<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Medical Chatbot</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>


<body>


<header>

    <div>

        <h1>
            🤖 Medical Chatbot
        </h1>

        <p>
            Ask in text or voice
        </p>

    </div>


    <select
        id="language"
        onchange="changeLanguage()"
    >

        <option value="en">
            English
        </option>

        <option value="te">
            తెలుగు
        </option>

        <option value="hi">
            हिन्दी
        </option>

        <option value="ta">
            தமிழ்
        </option>

        <option value="kn">
            ಕನ್ನಡ
        </option>

    </select>

</header>


<main class="container narrow">


<section class="card chatbot-card">


<textarea
    id="question"
    rows="7"
    placeholder="Ask your health question..."
></textarea>


<div class="buttons">

    <button
        onclick="askCopilot()"
    >
        Ask
    </button>


    <button
        onclick="startVoice()"
    >
        🎤 Voice Input
    </button>


    <button
        class="secondary"
        onclick="location.href='/home'"
    >
        ← Back to Home
    </button>

</div>


<div
    id="copilotResult"
    class="result"
></div>


</section>


</main>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

</body>

</html>
