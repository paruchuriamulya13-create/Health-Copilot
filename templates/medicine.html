<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Medicine Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div>

        <h1>
            💊 Medicine Analyzer
        </h1>

        <p>
            Medicine Photo Analysis
        </p>

    </div>

</header>


<main class="page-container">


    <a
        href="{{ url_for('home') }}"
        class="back-button">

        ← Back to Home

    </a>


    <section class="card">

        <h2>
            💊 Medicine Photo Analyzer
        </h2>

        <p>
            Upload a clear medicine strip,
            box or tablet package photo.
        </p>


        <input
            type="file"
            id="medicineFile"
            accept="image/*">


        <button
            type="button"
            id="medicineButton"
            onclick="analyzeMedicine()">

            🔍 Read Medicine

        </button>


        <div
            id="medicineResult"
            class="result">
        </div>

    </section>


</main>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
